name: Deploy to GitHub Pages

# Abgeschaltet: healthleticx läuft über die eigene Domain bei Cloud86 (Upload per Plesk).
# Nur noch von Hand startbar.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Statische Seite, kein Build-Schritt: nur die Dateien der Website einsammeln
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html kontakt impressum datenschutz danke assets _site/
          cp favicon.svg apple-touch-icon.png og-image.png robots.txt sitemap.xml _site/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
